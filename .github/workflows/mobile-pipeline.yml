name: SchoolOS Mobile Pipeline

on:
  push:
    branches: [master]
    paths:
      - 'apps/mobile/**'
  pull_request:
    branches: [master]
    paths:
      - 'apps/mobile/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schoolos-mobile-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Mobile Validation
    runs-on: [self-hosted, linux, x64, schoolos-ci]
    
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout commit
        uses: actions/checkout@v5
        with:
          clean: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx --no-install tsc --noEmit
      - name: Validate Native Configuration (Prebuild)
        run: npx --no-install expo prebuild --no-install
