name: Authoritative E2E

on:
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare
    runs-on: [self-hosted, linux, x64, schoolos-ci]
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          
      - name: Verify Prerequisites
        run: |
          chmod +x scripts/ci-runner-preflight.sh
          ./scripts/ci-runner-preflight.sh

  e2e:
    needs: prepare
    runs-on: [self-hosted, linux, x64, schoolos-ci]

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - mobile-chrome
          - webkit

    name: E2E (${{ matrix.browser }})

    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: |
          if [ "${{ matrix.browser }}" = "mobile-chrome" ]; then
            npx playwright install chromium
          else
            npx playwright install ${{ matrix.browser }}
          fi

      - name: Start Local Supabase
        run: npx --no-install supabase start

      - name: Wait for PostgreSQL Readiness
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          DB_CONTAINER=$(docker ps -qf name="supabase_db_")
          if [ -n "$DB_CONTAINER" ]; then
            until docker exec $DB_CONTAINER pg_isready -U postgres; do
              echo "Waiting for postgres..."
              sleep 2
            done
          else
            echo "Supabase DB container not found!"
            exit 1
          fi

      - name: Reset Database
        run: npx --no-install supabase db reset --yes

      - name: Build Web
        run: npm run build:web

      - name: Run Playwright Tests
        env:
          PLAYWRIGHT_GIT_COMMIT_INFO: 0
        run: |
          cd apps/web
          npx playwright test \
            --project=${{ matrix.browser }}-superadmin \
            --project=${{ matrix.browser }}-branchadmin \
            --project=${{ matrix.browser }}-teacher

      - name: Upload Playwright Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Stop Local Supabase
        if: always()
        run: npx --no-install supabase stop

      - name: Cleanup Workspace
        if: always()
        run: git clean -ffdx && git reset --hard HEAD

