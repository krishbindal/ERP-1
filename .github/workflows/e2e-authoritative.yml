name: Authoritative E2E

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: [self-hosted, linux, x64, schoolos-ci]
    steps:
      - name: Checkout commit
        uses: actions/checkout@v5
        
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          
      - name: Verify Prerequisites
        run: |
          echo "Prerequisites verified."

  e2e:
    name: E2E - ${{ matrix.browser }}
    needs: prepare
    runs-on: [self-hosted, linux, x64, schoolos-ci]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, mobile-chrome, webkit]

    steps:
      - name: Checkout commit
        uses: actions/checkout@v5
        with:
          clean: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser == 'mobile-chrome' && 'chromium' || matrix.browser }}

      - name: Start Local Supabase
        run: npx --no-install supabase start

      - name: Wait for PostgreSQL Readiness
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          DB_CONTAINER=$(docker ps -qf name="supabase_db_")
          if [ -n "$DB_CONTAINER" ]; then
            until docker exec $DB_CONTAINER pg_isready -U postgres; do
              echo "Waiting for postgres..."
              sleep 2
            done
          else
            echo "Supabase DB container not found!"
            exit 1
          fi

      - name: Reset Database
        run: npx --no-install supabase db reset --yes

      - name: Build Web
        run: npm run build:web

      - name: Run Playwright Tests
        run: |
          cd apps/web
          npx playwright test \
            --project=${{ matrix.browser }}-superadmin \
            --project=${{ matrix.browser }}-branchadmin \
            --project=${{ matrix.browser }}-teacher

      - name: Upload Playwright Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Stop Local Supabase
        if: always()
        run: npx --no-install supabase stop

      - name: Cleanup Workspace
        if: always()
        run: git clean -ffdx && git reset --hard HEAD

