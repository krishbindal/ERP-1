name: Authoritative E2E

on:
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

concurrency:
  group: schoolos-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: [self-hosted, linux, x64, schoolos-ci]
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          
      - name: Verify Prerequisites
        run: |
          chmod +x scripts/ci-runner-preflight.sh
          ./scripts/ci-runner-preflight.sh

  e2e:
    needs: prepare
    runs-on: [self-hosted, linux, x64, schoolos-ci]

    name: E2E (All Browsers)

    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Verify Playwright Browsers
        run: |
          chmod +x scripts/ci-runner-preflight.sh
          ./scripts/ci-runner-preflight.sh

      - name: Cleanup Stale Environment
        run: |
          npx --no-install supabase stop --no-backup || true
          
          # Verify and clean any stale ERP_1 resources
          STALE_CONTAINERS=$(docker ps -a -q -f label=com.supabase.cli.project=ERP_1)
          if [ -n "$STALE_CONTAINERS" ]; then
            echo "Removing stale containers..."
            echo "$STALE_CONTAINERS" | xargs -r docker rm -f
          fi
          
          STALE_NETWORKS=$(docker network ls -q -f label=com.supabase.cli.project=ERP_1)
          if [ -n "$STALE_NETWORKS" ]; then
            echo "Removing stale networks..."
            echo "$STALE_NETWORKS" | xargs -r docker network rm
          fi
          
          STALE_VOLUMES=$(docker volume ls -q -f label=com.supabase.cli.project=ERP_1)
          if [ -n "$STALE_VOLUMES" ]; then
            echo "Removing stale volumes..."
            echo "$STALE_VOLUMES" | xargs -r docker volume rm
          fi

      - name: Verify Clean State
        run: |
          STALE=$(docker ps -q -f label=com.supabase.cli.project=ERP_1)
          if [ -n "$STALE" ]; then
            echo "::error::Stale containers for ERP_1 remain after cleanup!"
            docker ps -a -f label=com.supabase.cli.project=ERP_1
            exit 1
          fi

      - name: Environment Preflight
        run: |
          chmod +x scripts/ci-env-preflight.sh
          ./scripts/ci-env-preflight.sh
          sleep 10

      - name: Start Local Supabase
        run: |
          if ! timeout 300s npx --no-install supabase start -x realtime --debug > start_output.log 2>&1; then
            echo "::error::Supabase start failed or timed out!"
            echo "--- Diagnostic Trap ---"
            docker ps -a
            for c in $(docker ps -a -q -f label=com.supabase.cli.project=ERP_1); do
              echo "--- Inspecting $c ---"
              docker inspect $c
              docker inspect $c --format '{{json .State}}'
              docker inspect $c --format '{{.State.ExitCode}}'
              docker inspect $c --format '{{.State.Error}}'
              docker inspect $c --format '{{.State.OOMKilled}}'
              echo "--- Logs $c ---"
              docker logs $c || true
              echo "--- Port $c ---"
              docker port $c || true
            done
            echo "--- System Diagnostics ---"
            docker stats --no-stream || true
            docker events --since 5m --until 0m -f label=com.supabase.cli.project=ERP_1 || true
            sudo ss -ltnp || true
            docker network ls || true
            docker network inspect supabase_network_ERP_1 || true
            echo "--- Start Output ---"
            cat start_output.log || true
            exit 1
          fi

      - name: Wait for PostgreSQL Readiness
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          DB_CONTAINER=$(docker ps -q -f label=com.supabase.cli.project=ERP_1 -f name=supabase_db_)
          if [ -n "$DB_CONTAINER" ]; then
            until docker exec $DB_CONTAINER pg_isready -U postgres; do
              echo "Waiting for postgres..."
              sleep 2
            done
            if ! bash -c '</dev/tcp/127.0.0.1/54322' 2>/dev/null; then
              echo "::error::Port 54322 is not reachable from host!"
              exit 1
            fi
          else
            echo "::error::Supabase DB container not found!"
            exit 1
          fi

      - name: Reset Database
        run: |
          if ! timeout 300s npx --no-install supabase db reset --yes > reset_output.log 2>&1; then
            echo "::error::Supabase db reset failed or timed out!"
            echo "--- Reset Output ---"
            cat reset_output.log || true
            echo "--- Docker PS ---"
            docker ps -a -f label=com.supabase.cli.project=ERP_1 || true
            echo "--- Postgres Logs ---"
            DB_CONTAINER=$(docker ps -q -f label=com.supabase.cli.project=ERP_1 -f name=supabase_db_)
            if [ -n "$DB_CONTAINER" ]; then docker logs $DB_CONTAINER || true; fi
            echo "--- Auth Logs ---"
            AUTH_CONTAINER=$(docker ps -q -f label=com.supabase.cli.project=ERP_1 -f name=supabase_auth_)
            if [ -n "$AUTH_CONTAINER" ]; then docker logs $AUTH_CONTAINER || true; fi
            echo "--- Realtime Logs ---"
            RT_CONTAINER=$(docker ps -q -f label=com.supabase.cli.project=ERP_1 -f name=supabase_realtime_)
            if [ -n "$RT_CONTAINER" ]; then docker logs $RT_CONTAINER || true; fi
            echo "--- Supabase Status ---"
            npx --no-install supabase status || true
            exit 1
          fi

      - name: Verify Post-Reset Readiness
        run: |
          echo "Verifying database readiness after reset..."
          DB_CONTAINER=$(docker ps -q -f label=com.supabase.cli.project=ERP_1 -f name=supabase_db_)
          if [ -z "$DB_CONTAINER" ]; then
            echo "::error::Supabase DB container not found after reset!"
            exit 1
          fi
          
          if ! docker exec $DB_CONTAINER pg_isready -U postgres; then
            echo "::error::Postgres is not accepting connections!"
            exit 1
          fi
          
          if ! bash -c '</dev/tcp/127.0.0.1/54322' 2>/dev/null; then
            echo "::error::Port 54322 is not reachable from host!"
            exit 1
          fi
          
          if ! docker exec $DB_CONTAINER psql -U postgres -c "SELECT 1;" > /dev/null; then
            echo "::error::Postgres test query failed!"
            exit 1
          fi
          
          echo "Database is fully ready and reachable."

      - name: Build Web
        run: npm run build:web

      - name: Run Playwright Tests
        env:
          PLAYWRIGHT_GIT_COMMIT_INFO: 0
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json
        run: |
          cd apps/web
          npx playwright test --reporter=line,json
          
      - name: Certify Playwright Results
        if: always()
        run: |
          node scripts/verify-playwright-results.js apps/web/playwright-report/results.json

      - name: Upload Playwright Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-all-browsers
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Stop Local Supabase
        if: always()
        run: bash scripts/ci-cleanup.sh

      - name: Cleanup Workspace
        if: always()
        run: git clean -ffdx && git reset --hard HEAD

