name: Authoritative E2E

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          
      - name: Verify Prerequisites
        run: |
          echo "Prerequisites verified."

  e2e:
    needs: prepare
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - mobile-chrome
          - webkit

    name: E2E (${{ matrix.browser }})

    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: |
          if [ "${{ matrix.browser }}" = "mobile-chrome" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install --with-deps ${{ matrix.browser }}
          fi

      - name: Start Local Supabase
        run: npx --no-install supabase start

      - name: Wait for PostgreSQL Readiness
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          DB_CONTAINER=$(docker ps -qf name="supabase_db_")
          if [ -n "$DB_CONTAINER" ]; then
            until docker exec $DB_CONTAINER pg_isready -U postgres; do
              echo "Waiting for postgres..."
              sleep 2
            done
          else
            echo "Supabase DB container not found!"
            exit 1
          fi

      - name: Reset Database
        run: npx --no-install supabase db reset --yes

      - name: Build Web
        run: npm run build:web

      - name: Run Playwright Tests
        run: |
          cd apps/web
          npx playwright test \
            --project=${{ matrix.browser }}-superadmin \
            --project=${{ matrix.browser }}-branchadmin \
            --project=${{ matrix.browser }}-teacher

      - name: Upload Playwright Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Stop Local Supabase
        if: always()
        run: npx --no-install supabase stop

      - name: Cleanup Workspace
        if: always()
        run: git clean -ffdx && git reset --hard HEAD

  publish:
    name: Publish Reports
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Echo Publish
        run: echo "Publishing E2E Results"
